<p-toolbar>
    <ng-template #start>
        <p-avatar image="assets/photomoi.jpg" [style]="{ width: '45px', height: '52px' }" />
        <div class="flex flex-column ml-2">
            <div class="font-semibold text-xl">Mon</div>
            <div class="font-semibold text-xl">Portfolio</div>
        </div>
    </ng-template>
    <ng-template #center>
        <p-button icon="pi pi-plus" label="Accueil" class="mr-2" text severity="secondary" routerLink="" />
        <p-divider layout="vertical" />
        <p-button icon="pi pi-print" label="A propos" class="mr-2" text severity="secondary" />
        <p-divider layout="vertical" />
        <p-button icon="pi pi-upload" label="Projets" text severity="secondary" />
        <p-divider layout="vertical" />
        <p-button icon="pi pi-envelope" label="Contact" text severity="secondary" routerLink="/contact">
        </p-button>
    </ng-template>
    <ng-template #end>
        <p-splitbutton label="Me soutenir" [model]="items" />
    </ng-template>
</p-toolbar>
